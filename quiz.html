<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1{
           display: flex;
           justify-content: center;
        }


        button{
            width: 200px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        What is 3 x 3?
    </h1>
        <button onclick="quizcheker(6)">6</button>
        <button onclick="quizcheker(9)">9</button>
        <button onclick="quizcheker(12)">12</button>

        <p>Your answer is:<span id="res"></span></p>
</body>
<script>
    function quizcheker(num1) {
        console.log(num1)
        if(num1 === 9) {
            document.getElementById("res").innerText = "Right"
        } else {
            document.getElementById("res").innerText = "wrong"
        }
    }
</script>
</html>
